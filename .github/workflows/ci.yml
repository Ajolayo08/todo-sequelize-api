name: Node.js CI Pipeline

# Trigger this workflow on git push or pull request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test_and_lint:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Tests
        env:
          REDIS_URL: redis://localhost:6379
        run: npm test

     # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies cleanly
      - name: Install dependencies
        run: npm install

      # 4. Run Linter (Checks code quality)
      - name: Run ESLint
        run: npm run lint --if-present

      # 5. Run Automated Tests
      - name: Run Tests
        run: npm test --if-present
        env:
          REDIS_URL: redis://localhost:6379
          GOOGLE_CLIENT_ID: "mock-google-client-id"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret"
          SESSION_SECRET: "mock-session-secret"
          PORT: 3000
        run: npm test