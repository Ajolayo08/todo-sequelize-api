events {
    # Handles worker connections (default settings)
    worker_connections 1024;
}

http {
    # Include standard MIME types for static assets
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Define our Express app backend server
    upstream express_backend {
        server host.docker.internal:5000; # For Docker setup (or 127.0.0.1:5000 for native Nginx)
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Forward all API traffic to Express
        location / {
            proxy_pass http://express_backend;
            
            # Forward real client headers to Express
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Example: Custom error handling directly from Nginx
        error_page 500 502 503 504 /5x.html;
        location = /5x.html {
            root /usr/share/nginx/html;
        }
    }
}

